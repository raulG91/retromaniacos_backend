version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - mysql
    env_file:
      - .env 
    restart: always

  mysql:
    image: mysql:8.0
    env_file:
      - .env             
    ports:
      - "3306:3306"          
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always

volumes:
  mysql_data:
    